[project]
name = "fpv-maps"
version = "0.1.0"
description = "Build maps of real places for The Zone FPV simulator from open geodata"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3.10",
    "shapely>=2.0",
    "trimesh>=4.4",
    "rich>=13.0",
    "pyogrio>=0.13.0",
]

[project.scripts]
fpv-maps = "fpv_maps.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpv_maps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
