[project]
name = "fpv-maps"
version = "0.5.0"
description = "Build maps of real places for The Zone FPV simulator from open geodata"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3.10",
    "shapely>=2.0",
    "trimesh>=4.4",
    "rich>=13.0",
    "pyogrio>=0.13.0",
    # Read the Maa- ja Ruumiamet lidar. lazrs is the LAZ decoder and it is a Rust
    # wheel, so this stays a wheels only install on every platform.
    "laspy[lazrs]>=2.5",
]

# The offscreen renderer of "fpv-maps tour". It is optional, because glcontext, which
# moderngl needs, ships source only for Linux and Windows, so it needs a C++ compiler.
# The pipeline itself installs everywhere with wheels alone. Install it with
# "uv sync --extra tour".
[project.optional-dependencies]
tour = [
    "moderngl>=5.10",
    "imageio-ffmpeg>=0.5",
]
# Reading an own drone survey. DJI Terra writes some 3D Tiles with Draco compressed
# geometry, and nothing in the base dependencies decodes it. DracoPy ships wheels for
# macOS, Windows and Linux, so this extra still needs no compiler. It is optional
# because only a survey map needs it, and no map in "maps/" does.
survey = [
    "DracoPy>=1.4",
]
# Photo textured facades. The camera resection is a non linear least squares fit and
# nothing in the base dependencies solves one. scipy ships wheels everywhere, so this
# extra needs no compiler either. It is optional because only a map with a [facades]
# section needs it, and only maps that are never published have one.
facades = [
    "scipy>=1.13",
]

[project.scripts]
fpv-maps = "fpv_maps.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpv_maps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
