name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        # The facades extra as well, or tests/test_facades.py skips itself and the
        # camera resection is tested nowhere.
        run: uv sync --frozen --extra facades
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test
        run: uv run pytest
      - name: Smoke test the CLI
        run: uv run fpv-maps area maps/tartu-annelinn-test.toml

      - name: A base install has no skipped test but the optional ones
        run: |
          uv sync --frozen
          uv run pytest -q -rs

  # The renderer is an optional extra, because glcontext needs a C++ compiler outside
  # macOS. Mesa draws in software here, so the tests render small pictures only.
  renderer:
    name: The offscreen renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: OpenGL, to build glcontext and to draw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ libx11-dev libgl1-mesa-dev libegl1-mesa-dev \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libgbm1
      - name: Install with the tour extra
        run: uv sync --frozen --extra tour
      - name: Test the renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          EGL_PLATFORM: surfaceless
        run: |
          uv run pytest tests/test_render.py -v -rs | tee result.txt
          # This job exists to draw. A skipped test means that the runner gave no
          # OpenGL context, and then the renderer is not tested anywhere.
          if grep -q skipped result.txt; then
            echo "The renderer tests skipped. This runner has no OpenGL context."
            exit 1
          fi

  privacy:
    name: No text points at one machine or one person
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-privacy.sh
      - name: Preview the pending release notes
        run: scripts/release-notes.sh >/dev/null

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fpv-maps:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm fpv-maps:ci --version
