name: release

# A tag `vX.Y.Z` builds every map in maps/ from the open data and publishes a GitHub
# release. A map with `private = true` is skipped everywhere below: it is built and
# flown locally and it is never published. See docs/licensing.md.
# release with the map files, the previews and the build reports. The tag must match
# the version in pyproject.toml. The release notes come from git history, see
# scripts/release-notes.sh and AGENTS.md, Releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The whole history and every tag. The notes are built from the commits since
      # the previous release tag, and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Check that every map has a preview image
        run: |
          for cfg in maps/*.toml; do
            if grep -q '^private = true' "$cfg"; then continue; fi
            name=$(grep -m1 '^name = ' "$cfg" | sed -E 's/name = "(.*)"/\1/')
            test -s "docs/screenshots/$name-preview.jpg" || { echo "docs/screenshots/$name-preview.jpg is missing. Build the map and copy the preview."; exit 1; }
          done

      # A build agent has no GPU, so it never renders a tour. The pictures come from a
      # workstation and they are in git. See docs/decisions.md.
      - name: Check that every map has a tour picture
        run: |
          for cfg in maps/*.toml; do
            if grep -q '^private = true' "$cfg"; then continue; fi
            name=$(grep -m1 '^name = ' "$cfg" | sed -E 's/name = "(.*)"/\1/')
            count=$(ls docs/screenshots/"$name"-tour-*.jpg 2>/dev/null | wc -l)
            test "$count" -gt 0 || { echo "docs/screenshots/$name-tour-*.jpg is missing. Run 'fpv-maps tour maps/$name.toml --publish'."; exit 1; }
          done

      - name: Refuse tracked text that points at one machine or one person
        run: scripts/check-privacy.sh

      - name: Write the release notes
        run: |
          scripts/release-notes.sh "${{ github.ref_name }}" > release-notes.md
          echo "release notes: $(wc -c < release-notes.md) bytes"

      - name: Refuse notes that point at one machine or one person
        run: scripts/check-privacy.sh release-notes.md

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # The source data is public and does not change for a given file name, so a
      # cache hit is always valid. The key changes when a map config changes.
      # Only the downloads go into the cache, not the files that the build unpacks
      # from them. The base map downloads 1.6 GB but needs 2.8 GB on disk, and the
      # pipeline unpacks a zip again when its folder is missing.
      - name: Cache the Maa-amet downloads
        uses: actions/cache@v4
        with:
          path: |
            data/raw/dtm_1m
            data/raw/**/*.zip
          key: maa-amet-${{ hashFiles('maps/*.toml') }}
          restore-keys: maa-amet-

      # The base map is 9 x 9 km. Its first build downloads 1.6 GB and uses about
      # 3 GB of memory. Later runs read the cache.
      - name: Build every map
        run: |
          mkdir -p release-assets
          for cfg in maps/*.toml; do
            if grep -q '^private = true' "$cfg"; then continue; fi
            name=$(grep -m1 '^name = ' "$cfg" | sed -E 's/name = "(.*)"/\1/')
            uv run fpv-maps build "$cfg"
            uv run fpv-maps inspect "dist/$name/$name.glb"
            cp "dist/$name/$name.glb" "dist/$name/$name-preview.jpg" "dist/$name/$name-build-report.json" release-assets/
          done
          ls -la release-assets

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "The Zone FPV maps ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --verify-tag \
            release-assets/*

      # The tour videos are too large for git and a build agent cannot render them.
      # Upload them from a workstation: scripts/publish-tours.sh <tag>.
      - name: Say what is left to do
        run: echo "Now run scripts/publish-tours.sh ${{ github.ref_name }} to add the tour videos and the wiki gallery."
