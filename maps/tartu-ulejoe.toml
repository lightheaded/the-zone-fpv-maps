# A 1 km2 tile of Ulejoe in Tartu, with the river and the north edge of the old town
# bank. The box does not align to the Maa-amet 1:2000 grid, so four orthophoto sheets
# and two elevation sheets feed one 8192 px texture. It holds the old factory block at
# Puiestee 13b, the university stadium, Lodjakoda, Peetri kirik and the Emajogi
# between the Vabadussild and the Kroonuaia sild. See docs/locations.md.

[map]
name = "tartu-ulejoe"
description = "1 km2 of Ulejoe in Tartu: the old factory block at Puiestee, the university stadium, Lodjakoda, the two spires of Peetri kirik and the Emajogi between two bridges."

[area]
# L-EST97 (EPSG:3301), order east, north: xmin, ymin, xmax, ymax.
bbox = [658600, 6474850, 659600, 6475850]
# The spawn point is on the Emajogi, 89 m from the Kroonuaia sild and 89 m from the
# Vabadussild. The water is 31.5 m above sea level in the EH2000 system and the
# nearest LOD2 building stands 38 m away on the south bank, so the water is open.
origin = [659228, 6474937]

[terrain]
step_m = 2.0

[ground_texture]
# 8192 px over 1000 m is 12 cm per pixel. The city orthophoto is 10 cm.
size_px = 8192
jpeg_quality = 88

[buildings]
enabled = true
municipalities = ["Tartu_linn"]
wall_material = "z_concrete2"
# Every roof takes its own picture from the 10 cm orthophoto, straight down, instead
# of one in-game asphalt for every house in the city. A tin roof is then red, a tile
# roof is brown and a flat roof has its vents on it. roof_material is unused while
# this is set, and it stays so that turning the option off needs no other edit.
roof_source = "orthophoto"
roof_material = "z_pebbled_asphalt"

[probes]
enabled = false

# The camera tour that "fpv-maps tour" renders. Every target is L-EST97 (east, north).
# Peetri kirik is the tallest structure of the tile at 59.1 m, which agrees with the
# 59 m spires in docs/maps.md. The river line comes from the lowest six percent of the
# terrain cells of the built map. Their long axis runs north west to south east.
[tour]
fps = 60
size = [1920, 1080]

[[tour.shot]]
name = "overview"
kind = "orbit"
seconds = 12
target = [659100, 6475350]
radius_m = 700
height_m = 420
turns = 0.30
look_height_m = 20
fov_deg = 42

[[tour.shot]]
name = "peetri-kirik"
kind = "orbit"
seconds = 11
target = [659523, 6475444]
radius_m = 150
height_m = 120
turns = 0.40
start_deg = 250
look_height_m = 33

[[tour.shot]]
name = "emajogi"
kind = "fly"
seconds = 12
start = [658566, 6475482]
end = [659272, 6474924]
height_m = 48
look_ahead_m = 150
look_height_m = 4

[[tour.shot]]
name = "spawn"
kind = "reveal"
seconds = 9
target = [659228, 6474937]
radius_m = 240
height_m = 90
turns = 0.22
look_height_m = 6
