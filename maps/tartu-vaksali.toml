# A 1 km2 tile of the Tartu industry belt, over Ropka, Karlova and Vaksali. The box
# is the Maa-amet 1:2000 sheet 473658, so one orthophoto sheet and one elevation
# sheet cover it. It holds the Tartu Mill elevator, the railway station with its
# freight yard, Aparaaditehas, the veetorn and Pauluse kirik. The tile is the first
# candidate for photo facades, because a person can photograph every landmark from
# public ground. See docs/locations.md and docs/analysis.md section 4.

[map]
name = "tartu-vaksali"
description = "1 km2 of the Tartu industry belt: the Tartu Mill elevator, the railway yard, Aparaaditehas, the water tower and Pauluse kirik."

[area]
# L-EST97 (EPSG:3301), order east, north: xmin, ymin, xmax, ymax.
bbox = [658000, 6473000, 659000, 6474000]
# The spawn point is in the open freight yard. The nearest LOD2 building stands 121 m
# away and the ground is 63.2 m above sea level, so nothing encloses the drone. The
# Tartu Mill silos are 210 m south west, Pauluse kirik 425 m east and the veetorn
# 590 m north east.
origin = [658440, 6473320]

[terrain]
step_m = 2.0

[ground_texture]
# 8192 px over 1000 m is 12 cm per pixel. The city orthophoto is 10 cm.
size_px = 8192
jpeg_quality = 88

[buildings]
enabled = true
municipalities = ["Tartu_linn"]
wall_material = "z_concrete2"
# Every roof takes its own picture from the 10 cm orthophoto, straight down, instead
# of one in-game asphalt for every house in the city. A tin roof is then red, a tile
# roof is brown and a flat roof has its vents on it. roof_material is unused while
# this is set, and it stays so that turning the option off needs no other edit.
roof_source = "orthophoto"
roof_material = "z_pebbled_asphalt"

[probes]
enabled = false

# The camera tour that "fpv-maps tour" renders. Every target is L-EST97 (east, north).
# The three landmarks are the tallest structures of the tile. Their positions come from
# the built map, and their heights and distances agree with docs/maps.md: the elevator
# 204 m south west of the spawn at 48.6 m, the water tower 594 m north east at 34.6 m,
# and Pauluse kirik 431 m east at 25.2 m.
[tour]
fps = 60
size = [1920, 1080]

[[tour.shot]]
name = "overview"
kind = "orbit"
seconds = 12
target = [658500, 6473500]
radius_m = 700
height_m = 420
turns = 0.30
look_height_m = 20
fov_deg = 42

[[tour.shot]]
name = "tartu-mill"
kind = "orbit"
seconds = 11
target = [658326, 6473151]
radius_m = 120
height_m = 100
turns = 0.45
start_deg = 210
look_height_m = 27

[[tour.shot]]
name = "veetorn"
kind = "orbit"
seconds = 9
target = [658894, 6473703]
radius_m = 95
height_m = 72
turns = 0.40
start_deg = 30
look_height_m = 19

[[tour.shot]]
name = "pauluse-kirik"
kind = "orbit"
seconds = 9
target = [658870, 6473351]
radius_m = 80
height_m = 55
turns = 0.35
start_deg = 120
look_height_m = 14

[[tour.shot]]
name = "spawn"
kind = "reveal"
seconds = 9
target = [658440, 6473320]
radius_m = 230
height_m = 95
turns = 0.22
look_height_m = 8
